<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0d15" />
      <stop offset="50%" stop-color="#1d192b" />
      <stop offset="100%" stop-color="#141218" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0bcff" />
      <stop offset="100%" stop-color="#9a82db" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2838" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#211f2d" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="180" fill="#6750a4" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="450" r="220" fill="#7d5260" opacity="0.2" filter="url(#glow)" />
  <circle cx="700" cy="200" r="150" fill="#4f378b" opacity="0.25" filter="url(#glow)" />

  <!-- Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(80, 80)">
    <!-- Pill Badge -->
    <rect width="260" height="36" rx="18" fill="#4f378b" fill-opacity="0.6" stroke="#9a82db" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#d0bcff" />
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#eaddff" letter-spacing="0.5">MATERIAL 3 EXTENSIONS</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Angular Material
    </text>
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#primary-grad)" letter-spacing="-1">
      Enhanced
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#cac4d0" width="500">
      Production-grade SCSS mixin overrides for Angular Material 3.
    </text>
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#938f99">
      Multi-tier sizing (<tspan fill="#d0bcff" font-family="monospace">sz-xsmall</tspan> to <tspan fill="#d0bcff" font-family="monospace">sz-xlarge</tspan>) &amp; geometric shapes.
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="130" height="38" rx="8" fill="#332d41" stroke="#49454f" stroke-width="1" />
      <text x="65" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e8def8">Angular 22+</text>

      <rect x="145" y="0" width="145" height="38" rx="8" fill="#332d41" stroke="#49454f" stroke-width="1" />
      <text x="217" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e8def8">Pure CSS &amp; SCSS</text>

      <rect x="305" y="0" width="120" height="38" rx="8" fill="#332d41" stroke="#49454f" stroke-width="1" />
      <text x="365" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e8def8">WCAG AA</text>
    </g>

    <!-- Website URL link -->
    <g transform="translate(0, 395)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#d0bcff">ng-material-enhanced.laudebugs.me</text>
    </g>
  </g>

  <!-- Right Visual Preview Card Stack -->
  <g transform="translate(680, 75)">
    <!-- Container Mock Card -->
    <rect width="440" height="480" rx="16" fill="url(#card-grad)" stroke="#49454f" stroke-opacity="0.6" stroke-width="1.5" />

    <!-- Mock Title Bar -->
    <rect width="440" height="50" rx="16" fill="#1d192b" fill-opacity="0.8" />
    <rect y="48" width="440" height="2" fill="#49454f" fill-opacity="0.4" />
    <circle cx="28" cy="25" r="6" fill="#ff605c" />
    <circle cx="48" cy="25" r="6" fill="#ffbd44" />
    <circle cx="68" cy="25" r="6" fill="#00ca4e" />
    <text x="100" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cac4d0">Component Overrides Demo</text>

    <!-- Mock UI Elements Inside Card -->
    <!-- 1. Buttons Row -->
    <g transform="translate(30, 80)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#938f99" letter-spacing="0.5">BUTTON SHAPES &amp; SIZES</text>

      <rect x="0" y="15" width="100" height="40" rx="20" fill="#d0bcff" />
      <text x="50" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#381e72">Round</text>

      <rect x="115" y="15" width="110" height="40" rx="8" fill="#4f378b" />
      <text x="170" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#eaddff">Squircle</text>

      <rect x="240" y="15" width="140" height="40" rx="8" fill="#8c1d18" />
      <text x="310" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f9dedc">Destructive</text>
    </g>

    <!-- 2. Button Toggle Group -->
    <g transform="translate(30, 175)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#938f99" letter-spacing="0.5">SEGMENTED BUTTON TOGGLES</text>

      <g transform="translate(0, 15)">
        <rect width="380" height="40" rx="8" fill="#141218" stroke="#49454f" stroke-width="1" />
        <rect x="2" y="2" width="124" height="36" rx="6" fill="#4f378b" />
        <text x="64" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#eaddff">Day</text>
        <text x="190" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cac4d0">Week</text>
        <text x="316" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cac4d0">Month</text>
      </g>
    </g>

    <!-- 3. Form Field Input Mock -->
    <g transform="translate(30, 270)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#938f99" letter-spacing="0.5">FORM FIELD (OUTLINE SQUIRCLE)</text>

      <g transform="translate(0, 15)">
        <rect width="380" height="48" rx="8" fill="none" stroke="#d0bcff" stroke-width="1.5" />
        <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#e6e0e9">Primary Input Field</text>
        <rect x="330" y="14" width="20" height="20" rx="4" fill="#4f378b" />
      </g>
    </g>

    <!-- 4. Chips & Progress Bar -->
    <g transform="translate(30, 375)">
      <!-- Progress Bar -->
      <rect width="380" height="12" rx="6" fill="#332d41" />
      <rect width="250" height="12" rx="6" fill="url(#primary-grad)" />

      <!-- Chips row -->
      <g transform="translate(0, 28)">
        <rect width="90" height="32" rx="16" fill="#332d41" stroke="#49454f" stroke-width="1" />
        <text x="45" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e8def8">sz-small</text>

        <rect x="105" y="0" width="105" height="32" rx="16" fill="#4f378b" />
        <text x="157" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#eaddff">sz-medium</text>

        <rect x="225" y="0" width="90" height="32" rx="16" fill="#332d41" stroke="#49454f" stroke-width="1" />
        <text x="270" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e8def8">sz-large</text>
      </g>
    </g>
  </g>
</svg>
